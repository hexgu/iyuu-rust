# iyuu-reseed — IYUU cross-seed service
#
# The named volume holds the SQLite database, which is where the in-flight
# verification queue lives. Keep it: recreating the container without it drops
# every unresolved cross-seed and they will sit paused in the downloader again.
services:
  iyuu-reseed:
    # 默认用 GitHub Actions 构建好的镜像，不占本地编译资源。
    # 想自己构建就改成 `build: .`（两个都留着的话 compose 会先构建再用 build 的 tag）。
    image: ghcr.io/hexgu/iyuu-rust:latest
    # build: .
    container_name: iyuu-reseed
    restart: unless-stopped
    ports:
      - "8098:8098"
    volumes:
      - ./data:/data
      # Optional: give the container the same clock as the host so a cron like
      # "0 4 * * *" fires at 04:00 local rather than UTC.
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Shanghai
      IYUU_LOG: info
      # Optional: override the IYUU API base (self-hosted mirror / reverse proxy).
      # Leave it commented out to follow the membership tier selected in the UI
      # (free → 2025.iyuu.cn, SVIP → vip.iyuu.cn).
      #
      # This is intentionally an environment variable and not a settings field:
      # it is a deployment concern, and it must never be echoed to the browser.
      # The scheme is required — a value without http(s):// is ignored with a
      # warning at startup rather than silently prefixed.
      # IYUU_API_BASE: https://iyuu.example.com
      # Blank out the proxy that Docker injects from ~/.docker/config.json
      # (`proxies.default`). Inside the container 127.0.0.1 is the container
      # itself, not the host, so that proxy is unreachable and every outbound
      # call fails with "error sending request for url (...)". Blank values
      # override the injected ones; setting them here keeps working even when
      # the host proxy is off.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    healthcheck:
      # Must run under bash: /dev/tcp is a bash feature and Debian's /bin/sh is
      # dash, which reports "cannot create /dev/tcp/...: Directory nonexistent".
      # The runtime image has no curl/wget either, so this is the only probe
      # available — the same one the Dockerfile's HEALTHCHECK uses.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8098 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
