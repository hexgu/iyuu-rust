# iyuu-reseed — IYUU cross-seed service
#
# The named volume holds the SQLite database, which is where the in-flight
# verification queue lives. Keep it: recreating the container without it drops
# every unresolved cross-seed and they will sit paused in the downloader again.
services:
  iyuu-reseed:
    build: .
    image: iyuu-reseed:latest
    container_name: iyuu-reseed
    restart: unless-stopped
    ports:
      - "8098:8098"
    volumes:
      - ./data:/data
      # Optional: give the container the same clock as the host so a cron like
      # "0 4 * * *" fires at 04:00 local rather than UTC.
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Asia/Shanghai
      IYUU_LOG: info
    healthcheck:
      # Must run under bash: /dev/tcp is a bash feature and Debian's /bin/sh is
      # dash, which reports "cannot create /dev/tcp/...: Directory nonexistent".
      # The runtime image has no curl/wget either, so this is the only probe
      # available — the same one the Dockerfile's HEALTHCHECK uses.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8098 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
