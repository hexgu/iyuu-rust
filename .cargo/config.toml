# Crate registry mirror.
#
# rsproxy.cn is a full sparse-index mirror of crates.io run by the ByteDance
# Rust team. From mainland China it is one to two orders of magnitude faster
# than crates.io, which matters both for local builds and for the Docker
# builder stage. If you are outside CN and prefer the real registry, delete the
# `[source.crates-io]` replace-with block and leave `[net]` alone.
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
# Use the git CLI for git dependencies: libgit2's HTTP stack ignores proxy
# settings in some environments, the git binary does not.
git-fetch-with-cli = true
