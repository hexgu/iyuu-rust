# iyuu-reseed — 生产部署
#
#   docker compose up -d
#   docker compose logs -f
#
# 需要自己构建镜像时：
#   docker compose up -d --build
#
# 说明：
#   * 数据库（含 IYUU Token、各站点 passkey、下载器密码）在 ./data 下，务必备份且不要外传。
#   * 容器内 127.0.0.1 指的是容器自己。下载器跑在宿主机或别的机器上时，
#     请填它的局域网 IP，或使用 host.docker.internal（macOS / Windows）。
#   * 只对外暴露 8098。容器里没有内网穿透、反代或 TLS，需要的话在前面加一层。
#   * 进程不以 root 运行：镜像入口会先把 ./data 的属主改成 10001:10001，再降权启动。
#     第一次启动后 ./data 就归 10001 了，之后每次启动这一步是空操作。

name: iyuu-reseed

services:
  iyuu-reseed:
    image: ghcr.io/hexgu/iyuu-rust:latest
    build:
      context: .
    container_name: iyuu-reseed
    restart: unless-stopped

    ports:
      # 只监听回环，由宿主机上的反代（Caddy / Nginx / Traefik）对外提供服务。
      # 如果直接把 8098 暴露到局域网，改成 "8098:8098" 或 "0.0.0.0:8098:8098"，
      # 但要清楚：这个界面没有账号体系，能访问到就等于能用你的凭据辅种。
      - "127.0.0.1:8098:8098"

    volumes:
      # 辅种记录与在途校验队列都在这个库里。删掉它 = 所有在途校验丢失，
      # 种子会永久停在下载器里等着，所以用 bind mount 放在明处便于备份。
      - ./data:/data
      # 让容器和宿主用同一个时钟，否则 cron 里的 "0 4 * * *" 会按 UTC 触发。
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai
      IYUU_LOG: info
      # 覆盖 IYUU 接口地址（自建反代 / 镜像）时取消注释。必须带 http(s)://，
      # 否则启动时会告警并忽略。这是部署层面的事，不会出现在界面或 API 响应里。
      # IYUU_API_BASE: https://iyuu.example.com

    # 容器自身不写 /data 之外的任何位置，多一层防线。
    read_only: true
    tmpfs:
      - /tmp

    # 资源上限：这个服务是 IO 和网络型的，正常占用很低。给个上限是为了
    # 防止下载器异常时它把内存吃满影响宿主机。
    deploy:
      resources:
        limits:
          memory: 512M
          # 这个服务只有几个线程，限制进程数挡一挡 fork 炸弹类的意外。
          pids: 256

    healthcheck:
      # 镜像里没有 curl/wget，/dev/tcp 是 bash 内置特性，必须用 bash 执行
      # （Debian 的 /bin/sh 是 dash，会报 "cannot create /dev/tcp/..."）。
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8098 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 日志轮转，避免长期运行后把磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 收到 SIGTERM 后给足时间收尾，避免半个校验状态写坏。
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # 能力收敛：默认全丢，只留下入口脚本「把 /data 交给应用用户再降权」必需的四个。
    # 应用进程（uid 10001）跑起来时已经没有任何 capability。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

