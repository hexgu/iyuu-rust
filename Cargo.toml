[workspace]
members = ["crates/server", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["iyuu-reseed contributors"]
repository = "https://github.com/iyuu-reseed/iyuu-reseed"

# Lint policy (see rust-best-practices, chapter 2). Crates opt in with
# `[lints] workspace = true`, so the plain gate
#   cargo clippy --all-targets --all-features --locked -- -D warnings
# already enforces everything below.
[workspace.lints.rust]
future_incompatible = { level = "warn", priority = 10 }
nonstandard_style = { level = "deny", priority = 9 }
unsafe_code = { level = "forbid", priority = 8 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "deny", priority = 8 }
# Type names that repeat their module (`downloader::DownloaderClient`) read worse
# than the plain name; the project already names modules after their domain.
module_name_repetitions = { level = "allow", priority = 1 }

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
hyper = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# http client (rustls: no system openssl needed)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "charset",
    "http2",
    "cookies",
    "json",
    "stream",
    "multipart",
] }
urlencoding = "2"

# torrent parsing / hashing
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
rand = "0.9"
scraper = "0.23"

# html parsing for flux stylesheet
regex = "1"

# database
rusqlite = { version = "0.37", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"

# config / logging
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "json"] }
thiserror = "2"
anyhow = "1"

# time
chrono = { version = "0.4", features = ["serde"] }

# utils
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
dashmap = "6"
bitflags = "2"
